name: Renovate

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Arca Dependency Manager
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Token do App
        uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: agendamento (só schedule)
        if: github.event_name == 'schedule'
        run: |
          echo "Triggered by schedule at: $(date -u)"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-unknown}"
          echo "GITHUB_REF=${GITHUB_REF:-unknown}"

      - name: Executar Renovate
        uses: renovatebot/github-action@v41.0.1
        with:
          # É recomendável usar o token gerado aqui
          token: ${{ steps.generate_token.outputs.token }}
        env:
          # Se o bot roda no próprio repo, você pode usar a variável automática
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: 'github'
          # O Renovate geralmente detecta o autor se o token for de um App
