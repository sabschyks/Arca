name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v40.3.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
