name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Arca Dependency Manager
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Token do App
        uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Debug agendamento (só schedule)
        if: github.event_name == 'schedule'
        run: |
          echo "Triggered by schedule at: $(date -u)"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-unknown}"
          echo "GITHUB_REF=${GITHUB_REF:-unknown}"

      - name: Executar Renovate
        uses: renovatebot/github-action@v46.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: 'sabschyks/Arca'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_GIT_AUTHOR: 'Arca Bot <262118762+arca-dependency-manager[bot]@users.noreply.github.com>'
