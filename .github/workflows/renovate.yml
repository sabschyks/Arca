name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  issues:
    types: [edited] # Acorda o bot quando você interage com o Dashboard

jobs:
  renovate:
    name: Arca Dependency Manager
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Token do App
        uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar Renovate
        uses: renovatebot/github-action@v41.0.22
        with:
          token: ${{ steps.generate_token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: 'sabschyks/Arca'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_GIT_AUTHOR: 'Arca Bot <262118762+arca-dependency-manager[bot]@users.noreply.github.com>'
