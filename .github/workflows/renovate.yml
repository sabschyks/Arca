name: Renovate

on:
  schedule:
    - cron: "0 * * * *" # Roda a cada hora
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: renovatebot/github-action@v40.3.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_AUTODISCOVER: ${{ github.repository }}
          RENOVATE_PLATFORM: 'github'
          LOG_LEVEL: info
